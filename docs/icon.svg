<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="rayo">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1d8f"/>
      <stop offset="1" stop-color="#0d0722"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fffbd6"/>
      <stop offset="1" stop-color="#ffd21f"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffb400"/>
      <stop offset="1" stop-color="#ff4d2e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffb52e" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#ff5a3c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#night)"/>
  <circle cx="262" cy="256" r="230" fill="url(#glow)"/>
  <!-- speed -->
  <g stroke-linecap="round" stroke-width="14" fill="none">
    <path d="M62 226h74" stroke="#ffd21f" stroke-opacity="0.75"/>
    <path d="M92 290h66" stroke="#ff8a2b" stroke-opacity="0.65"/>
    <path d="M56 354h84" stroke="#ff5a3c" stroke-opacity="0.45"/>
  </g>
  <!-- the bolt, in two facets -->
  <path d="M334 48 304 206h98L216 464z" fill="url(#shade)"/>
  <path d="M334 48 160 276h88L216 464 304 206z" fill="url(#light)"/>
</svg>
